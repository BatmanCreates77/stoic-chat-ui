name: build

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd server && npm ci && npm test
      - run: cd web/js && node --test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: cd android && chmod +x gradlew && ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verify the APK is a valid, signed package
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -tq "$APK"
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: screenmeter-apk
          path: android/app/build/outputs/apk/release/app-release.apk
